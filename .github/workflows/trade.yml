name: trading-bots

on:
  schedule:
    # times are UTC
    - cron: "0 4 * * 1-5"     # ASX  - ~2-3pm Sydney time, Mon-Fri
    - cron: "30 19 * * 1-5"   # US   - ~2:30-3:30pm New York time, Mon-Fri
    - cron: "15 0 * * *"      # Crypto - daily, just after the UTC daily candle closes
    - cron: "0 6 * * 0"       # Weekly backtest refresh - Sunday
  workflow_dispatch:
    inputs:
      command:
        description: trade or backtest
        default: trade
        type: choice
        options: [trade, backtest]
      market:
        description: which bot
        default: all
        type: choice
        options: [all, us, asx, crypto]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trading-bots      # runs queue up instead of clashing over state files
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Work out what to run
        id: plan
        run: |
          CMD="${{ inputs.command }}"; MKT="${{ inputs.market }}"
          case "${{ github.event.schedule }}" in
            "0 4 * * 1-5")   CMD=trade;    MKT=asx ;;
            "30 19 * * 1-5") CMD=trade;    MKT=us ;;
            "15 0 * * *")    CMD=trade;    MKT=crypto ;;
            "0 6 * * 0")     CMD=backtest; MKT=all ;;
          esac
          echo "cmd=${CMD:-trade}" >> "$GITHUB_OUTPUT"
          echo "market=${MKT:-all}" >> "$GITHUB_OUTPUT"

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python run.py ${{ steps.plan.outputs.cmd }} --market ${{ steps.plan.outputs.market }}

      - name: Save state back to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "bot: ${{ steps.plan.outputs.cmd }} ${{ steps.plan.outputs.market }}"
          git pull --rebase && git push

      # Dashboard hosting. Needs Settings -> Pages -> Source: "GitHub Actions".
      # (Free accounts: Pages only works on public repos. If it fails, trading still ran.)
      - uses: actions/upload-pages-artifact@v3
        if: always()
        continue-on-error: true
        with:
          path: site

      - id: deploy
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
